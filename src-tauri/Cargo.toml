[package]
name = "photo-upload-audit"
version = "0.1.5"
description = "Verify a camera export against a backup folder"
authors = ["Param Factory"]
edition = "2021"
license = "MIT"

[lib]
name = "photo_upload_audit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
